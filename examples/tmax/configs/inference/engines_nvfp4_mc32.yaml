# Miles --sglang-config deployment, not a native SGLang --config.
# PREPARATION ONLY. This derived checkpoint does not exist yet; the pinned Miles
# runtime also needs dense NVFP4 publication and a weight-update/reload test.
sglang:
  - name: actor
    model_path: /weka/oe-adapt-default/gfaria/tmax-4b-miles/models/Qwen3.5-4B-tmax-template-NVFP4
    # A separate inference checkpoint must still receive actor updates during RL.
    update_weights: true
    num_gpus_per_engine: 1
    server_groups:
      - worker_type: regular
        num_gpus: 2
        overrides:
          dtype: bfloat16
          quantization: modelopt_fp4
          fp4_gemm_runner_backend: flashinfer_cutlass
