# smoke_4b_1node_imgd0831a475b.yaml with a 1 h min_runtime instead of 8 h, so it schedules sooner on Holmes.
# smoke_4b_1node.yaml on the first training image built from our own docker/Dockerfile and named by its commit
# (examples/tmax/docker/build_train_image.sh at d0831a475b: SGLang 7b6993a, Megatron 9df207fd1, docker/pip_pins.txt,
# Miles from the build context), with sandboxes on the podman-jupiter128-20261105 fleet. Same recipe and layout:
# 2 training GPUs (TP 1 x CP 1 x DP 2, 67,584 tokens per GPU) and 2 SGLang engines, 3 steps of 4 prompts x 8 samples.
exp_name: tmax_smoke_4b_1node_imgd0831a475b_minruntime1h
model_name: Qwen3.5-4B-tmax-template          # hamishivi/Qwen3.5-4B, its patched chat template
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
num_nodes: 1
num_gpus_per_node: 4
async_rollout_gpus: 2
rollout_batch_size: 4
n_samples_per_prompt: 8
num_rollout: 3
max_seq_len: 67584                            # prod's 64k response + 2k prompt
rollout_max_response_len: 16384
max_steps: 64
filter_zero_std: true
max_weight_staleness: 4
async_max_concurrent_samples: 64
async_data_buffer_capacity_factor: 4
tensor_model_parallel_size: 1
context_parallel_size: 1
max_tokens_per_gpu: 67584                     # >= max_seq_len: the longest trajectory fits one micro-batch
optimizer_cpu_offload: false
sglang_mem_fraction_static: 0.8
sandbox_start_concurrency: 16
start_failure: drop
save_interval: 1000
extra_args: "--log-probs-backend fused --distributed-timeout-minutes 120 --sglang-watchdog-timeout 1800"
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
output_dir: /weka/nora-default/shashankg/miles_tmax_v2/output
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true

beaker:
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  preemptible: false
  min_runtime: 1h
  retries: 0
  gpus: 4
  shared_memory: 256GiB
  image: beaker:shashankg/tmax-miles-train-d0831a475b
  dockerhub_username: shashankg209
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-jupiter128-20261105.sqlite3
  gateway_min_replicas: 8
